name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without signing
        run: |
          xcodebuild -project CourseIQ.xcodeproj \
            -scheme CourseIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find ./build -name "CourseIQ.app" -path "*Release-iphoneos*" | head -1)
          echo "App bundle: $APP"
          mkdir -p out/Payload
          cp -r "$APP" out/Payload/
          cd out && zip -qr CourseIQ.ipa Payload && cd ..
          ls -la out/CourseIQ.ipa

      - name: Publish IPA as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest --yes 2>/dev/null || true
          gh release create ipa-latest --title "CourseIQ IPA" --notes "Build automatique" out/CourseIQ.ipa
          echo "IPA_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/ipa-latest/CourseIQ.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: CourseIQ-ipa
          path: out/CourseIQ.ipa
          retention-days: 30
